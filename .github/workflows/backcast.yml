name: backcast

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "KR open date to simulate (YYYY-MM-DD)"
        required: true
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKCAST_DATE: ${{ inputs.target_date }}
          TZ: Asia/Seoul
        run: python backcast.py
