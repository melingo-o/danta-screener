name: intraday-master

on:
  schedule:
    # KST 08:00–08:55 (UTC 23 Sun–Thu) — pre-market news/DART window
    - cron: "*/5 23 * * 0-4"
    # KST 09:00–17:55 (UTC 00-08 Mon–Fri) — covers scanner (9-16) + news/DART (8-17) + recap (9:35)
    - cron: "*/5 0-8 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [intraday-tick]

permissions:
  contents: write

concurrency:
  group: intraday-master
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal deps
        run: pip install pytz

      - name: Run all intraday tasks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: python intraday_master.py

      - name: Commit any state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/market_state.json data/scanner_state.json data/dart_state.json data/news_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: intraday tick $(TZ=Asia/Seoul date +%H:%M)"
            git push || (git pull --rebase && git push)
          else
            echo "no state changes"
          fi
