name: morning-recap

on:
  schedule:
    # 09:40 KST Mon-Fri = 00:40 UTC Mon-Fri
    - cron: "40 0 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [morning-recap-trigger]

permissions:
  contents: write

concurrency:
  group: morning-recap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal deps
        run: pip install pytz

      - name: Run recap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          TZ: Asia/Seoul
        run: python morning_recap.py

      - name: Commit results journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/journal/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: morning recap $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          else
            echo "no recap changes"
          fi
