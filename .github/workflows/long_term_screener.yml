name: long-term-screener

on:
  schedule:
    # 매주 일요일 22:00 UTC = 월요일 07:00 KST
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: long-term-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml beautifulsoup4

      - name: Run long-term screener
        env:
          TZ: Asia/Seoul
        run: python long_term_screener.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Robust commit: save new data file, hard-sync to latest origin/main,
          # restore the saved file, then commit. Avoids merge conflicts when
          # other commits land during the long fetch.
          cp data/long_term_scores.json /tmp/lt_scores.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/lt_scores.json data/long_term_scores.json 2>/dev/null || true
          git add data/long_term_scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data: long-term screener $(TZ=Asia/Seoul date +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push attempt $attempt failed, refreshing and retrying"
              cp data/long_term_scores.json /tmp/lt_scores.json
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/lt_scores.json data/long_term_scores.json
              git add data/long_term_scores.json
              git commit -m "data: long-term screener $(TZ=Asia/Seoul date +%Y-%m-%d)" || true
              sleep 3
            done
            echo "::error::push failed after 3 attempts"
            exit 1
          else
            echo "no changes"
          fi
