name: long-term-screener

on:
  schedule:
    # 매주 일요일 22:00 UTC = 월요일 07:00 KST
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: long-term-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml beautifulsoup4

      - name: Run long-term screener
        env:
          TZ: Asia/Seoul
        run: python long_term_screener.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add data/long_term_scores.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data: long-term screener $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          else
            echo "no changes"
          fi
