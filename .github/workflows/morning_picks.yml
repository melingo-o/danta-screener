name: morning-picks

on:
  schedule:
    # 22:30 UTC Sun-Thu = 07:30 KST Mon-Fri (before pre-market open)
    - cron: "30 22 * * 0-4"
  workflow_dispatch:
  repository_dispatch:
    types: [morning-picks-trigger]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screening + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: python run.py

      - name: Commit universe snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data: update KRX universe snapshot ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          else
            echo "no snapshot changes"
          fi
